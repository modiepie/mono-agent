  intent: transactions
  tags: [compare, why]
  tools:
    - name: compare_periods
      args: {period_a: {date_from: 2025-11-01, date_to: 2025-11-30},
             period_b: {date_from: 2025-12-01, date_to: 2025-12-31}}
  numbers:
    - {fn: spent, period: 2025-12, category: groceries}
    - {fn: spent, period: 2025-11, category: groceries}

- id: cmp-total-nov-oct
  q: Why was my spending in November different from October?
  intent: transactions
  tags: [compare, why]
