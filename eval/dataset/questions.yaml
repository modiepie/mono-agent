      args: {period_a: {date_from: 2025-10-01, date_to: 2025-10-31},
             period_b: {date_from: 2025-11-01, date_to: 2025-11-30}}
  numbers: [{fn: spent, period: 2025-11}, {fn: spent, period: 2025-10}]
  reference: November includes a 54999 UAH Comfy laptop; October had car-service costs.

- id: cmp-fuel-why
