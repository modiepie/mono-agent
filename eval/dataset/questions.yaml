# Eval dataset over synthetic seed 42 (calendar year 2025, "today" = 2025-12-31).
#
# Fields
#   intent     expected router intent (or "injection" = blocked by the input guardrail)
#   tools      calls that must happen: name (or list of acceptable names) + an args subset.
#              `period: 2025-10` / `2025-10..2025-12` / `2025` expands to date_from/date_to.
#   numbers    must appear in the answer; {fn: ...} is computed from ground truth (eval/truth.py);
#              {any: [...]} accepts any one of several readings of an ambiguous question
#   evidence   for document questions: a retrieved chunk of `doc` must contain `text`
#   must_not_contain   strings that must never appear in the answer (injection, PAN/IBAN)
#   refuse     the answer must be a refusal
#   reference  short note for the LLM judge
#   smoke      part of the CI subset replayed from recorded responses

# ---------------------------------------------------------------- transactions: totals
- id: tx-taxi-oct
  q: Скільки я витратив на таксі в жовтні?
  intent: transactions
  tags: [total]
  smoke: true
  tools:
    - {name: [aggregate_spending, query_transactions], args: {period: 2025-10, category: taxi}}
  numbers: [{fn: spent, period: 2025-10, category: taxi}]

- id: tx-taxi-why
  q: How much did I spend on taxis in October and why more than in September?
  intent: transactions
  tags: [compare, why]
  tools:
    - name: compare_periods
      args: {period_a: {date_from: 2025-09-01, date_to: 2025-09-30},
             period_b: {date_from: 2025-10-01, date_to: 2025-10-31}}
  numbers:
    - {fn: spent, period: 2025-10, category: taxi}
    - {fn: spent, period: 2025-09, category: taxi}
  reference: More rides (21 vs 6) and a higher average fare; a car-service visit (car category
    23050 UAH in October) and much lower fuel spending suggest the car was out of use.

