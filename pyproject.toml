[project]
name = "mono-agent"
version = "0.1.0"
description = "LangGraph multi-agent personal-finance assistant over the monobank Personal API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are added per milestone, only when code uses them.
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28",
    "langchain>=1.5.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=7.1.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
mono-agent = "mono_agent.service.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Ukrainian text is intentional: Cyrillic letters that look like Latin ones are not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "eval"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
